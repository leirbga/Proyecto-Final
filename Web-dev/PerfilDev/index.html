<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | WebCraft Dev</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body id="bodyFondo" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
    

    <!-- Contenedor donde se inyecta la Navbar desde JavaScript -->
    <header id="navBar" class="w-full h-16 bg-slate-900/80 border-b border-slate-800 backdrop-blur-md sticky top-0 z-50">
    </header>

    <!-- Contenido Principal: Perfil -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10">
        
        <!-- Encabezado de Sección -->
        <div class="mb-8 border-b border-slate-800/80 pb-4 flex items-center justify-between">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight flex items-center gap-3">
                    Perfil de Desarrollador
                </h1>
                <p class="text-slate-400 text-sm mt-1">Gestiona tu información personal y credenciales de la plataforma.</p>
            </div>
            <span class="hidden sm:inline-flex items-center px-3 py-1 rounded-full text-xs font-mono font-medium bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                Estado: Activo
            </span>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 md:p-8 backdrop-blur-md shadow-2xl relative overflow-hidden">
            <!-- Efecto Glow de fondo -->
            <div class="absolute -top-16 -right-16 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <form id="perfilForm" class="space-y-6">
                
                <!-- Encabezado del Perfil (Avatar + Info rápida) -->
                <div class="flex items-center gap-5 border-b border-slate-800/80 pb-6">
                    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan-500/20 to-blue-600/20 border border-cyan-500/30 flex items-center justify-center text-cyan-400 shadow-lg shadow-cyan-500/10">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 id="devNombreHeader" class="text-xl font-bold text-white">Cargando...</h2>
                            <span id="badgeDev" class="px-2.5 py-0.5 text-xs font-mono font-semibold rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">
                                Dev
                            </span>
                        </div>
                        <p class="text-xs text-slate-400 font-mono mt-1">ID: <span id="devIdHeader" class="text-slate-300">#...</span></p>
                    </div>
                </div>

                <!-- Grid de Inputs del Formulario -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Campo: Nombre -->
                    <div>
                        <label for="nombre" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Nombre Completo</label>
                        <div class="relative">
                            <input type="text" id="nombre" name="nombre" readonly 
                                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500/50 transition-colors cursor-not-allowed">
                        </div>
                    </div>

                    <!-- Campo: Correo -->
                    <div>
                        <label for="email" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Correo Electrónico</label>
                        <div class="relative">
                            <input type="email" id="email" name="email" readonly 
                                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500/50 transition-colors cursor-not-allowed">
                        </div>
                    </div>

                    <!-- Campo: Rol -->
                    <div>
                        <label for="rol" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Rol en el Sistema</label>
                        <div class="relative">
                            <input type="text" id="rol" name="rol" readonly 
                                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500/50 transition-colors cursor-not-allowed font-mono text-cyan-400">
                        </div>
                    </div>

                    <!-- Campo: Miembro desde -->
                    <div>
                        <label for="fecha" class="block text-xs font-medium uppercase tracking-wider text-slate-400 mb-2">Miembro desde</label>
                        <div class="relative">
                            <input type="text" id="fecha" name="fecha" readonly 
                                class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-200 focus:outline-none focus:border-cyan-500/50 transition-colors cursor-not-allowed font-mono">
                        </div>
                    </div>

                </div>

            </form>
        </div>
    </main>

    <!-- Script de navegación e inicialización -->
    <script type="module" src="index.js"></script>
    <script type="module" src="../../PaginaPrincipal/componentes/nav.js"></script>

</body>
</html>
