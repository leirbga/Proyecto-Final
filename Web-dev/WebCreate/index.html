<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../PaginaPrincipal/output.css">
    <!-- Axios Global CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>WebCraft - Crear Template</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pt-16">

    <!-- Navbar Superior (Renderizado mediante nav.js) -->
    <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>

    <!-- Contenedor dinámico de Notificaciones -->
    <div id="notificacion"></div>

    <!-- Layout Principal: Sidebar + Zona Central -->
    <div class="flex min-h-[calc(100vh-4rem)]">

        <!-- Sidebar Izquierdo -->
        <aside class="w-64 bg-slate-900/50 border-r border-slate-800 p-6 flex flex-col gap-6 shrink-0">
            <div class="flex flex-col gap-2">
                <a href="/Web-Clientes" id="btn-tienda" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
                    Ver Páginas
                </a>
                <a href="/Web-Clientes/MisPaginas" id="btn-mis-paginas" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
                    Mis Páginas
                </a>
                <a href="/Web-dev/WebCreate" id="btn-subir" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition-all hover:bg-cyan-500/20">
                    Subir Nuevo Template
                </a>
            </div>
        </aside>

        <!-- Contenido Principal Centrado -->
        <main class="flex-1 flex items-center justify-center p-4 md:p-8">
            
            <!-- Modal / Formulario de Registro -->
            <div class="relative w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
                
                <!-- Botón para Cerrar (X) -->
                <button id="btn-cerrar" type="button" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors p-1 rounded-lg bg-slate-800/50 hover:bg-slate-800 z-10">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>

                <!-- Lado Izquierdo: Cargar y Previsualizar Imagen -->
                <div class="w-full md:w-1/3 bg-slate-900/60 p-6 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-800 min-h-[250px]">
                    <label for="input-imagen" class="relative w-full h-full min-h-[200px] flex flex-col items-center justify-center bg-slate-950/60 border-2 border-dashed border-slate-700 hover:border-cyan-500/80 rounded-2xl cursor-pointer transition-all p-4 group overflow-hidden">
                        
                        <!-- Texto e Icono por defecto -->
                        <div id="contenido-placeholder" class="flex flex-col items-center justify-center">
                            <div class="p-4 rounded-full bg-slate-900 border border-slate-800 group-hover:border-cyan-500/40 text-slate-400 group-hover:text-cyan-400 transition-all mb-2">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                                </svg>
                            </div>
                            <span class="text-xs text-slate-400 text-center font-medium group-hover:text-slate-200 transition-colors">Subir Portada / Imagen</span>
                        </div>

                        <!-- Imagen para Previsualizar -->
                        <img id="img-vista-previa" src="" alt="Vista previa" class="hidden absolute inset-0 w-full h-full object-cover rounded-xl" />

                        <input id="input-imagen" type="file" accept="image/*" class="hidden" />
                    </label>
                </div>

                <!-- Lado Derecho: Formulario -->
                <form id="form-crear-post" class="w-full md:w-2/3 p-6 md:p-8 flex flex-col gap-4">
                    <h2 class="text-xl font-bold text-white mb-2">Crear Nuevo Post</h2>

                    <!-- Título -->
                    <div>
                        <input type="text" id="titulo" placeholder="Ingrese el título" required
                            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all text-sm" />
                    </div>

                    <!-- Descripción -->
                    <div>
                        <textarea id="descripcion" rows="3" placeholder="Ingrese descripción de la página" required
                            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all text-sm resize-none"></textarea>
                    </div>

                    <!-- Precio y Temática -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="relative flex items-center">
                            <input type="number" id="precio" step="0.01" min="0" placeholder="Ingrese el precio" required
                                class="w-full pl-4 pr-10 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all text-sm" />
                            <span class="absolute right-3 text-cyan-400 font-bold text-sm">$</span>
                        </div>

                        <!-- Se inyecta la lista de temáticas dinámicamente desde nav.js -->
                        <div id="tematica"></div>
                    </div>

                    <!-- URL Demo -->
                    <div>
                        <input type="url" id="url-demo" placeholder="Ingrese URL de demostración (https://...)" required
                            class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all text-sm" />
                    </div>

                    <!-- Botones de Acción -->
                    <div class="flex items-center gap-4 pt-2 mt-auto">
                        <button type="submit" id="btn-crear"
                            class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2.5 px-4 rounded-xl text-sm transition-all text-center cursor-pointer">
                            Crear Post
                        </button>
                        
                        <label for="input-archivos" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2.5 px-4 rounded-xl text-sm transition-all text-center cursor-pointer">
                            Subir Archivos
                            <input id="input-archivos" type="file" multiple class="hidden" />
                        </label>
                    </div>
                </form>

            </div>
        </main>

    </div>

    <!-- Scripts de la Aplicación -->
    <script type="module" src="../../PaginaPrincipal/componentes/nav.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
