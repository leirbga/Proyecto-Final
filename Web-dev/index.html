<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../PaginaPrincipal/output.css">
    <title>WebCraft</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pt-16">
    <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>
     <!-- Layout Principal: Sidebar + Contenido de Tienda -->
    <div class="flex min-h-[calc(100vh-4rem)]">

        <!-- Sidebar Izquierdo: Filtros y Secciones -->
        <aside class="w-64 bg-slate-900/50 border-r border-slate-800 p-6 flex flex-col gap-6 shrink-0">
            
            <!-- Navegación de Secciones -->
            <div class="flex flex-col gap-2">
                <a href="/Web-Clientes" id="btn-tienda" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition-all hover:bg-cyan-500/20">
                    Ver Paginas
                </a>
                <a href="/Web-Clientes/MisPaginas" id="btn-mis-paginas" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
                    Mis Páginas
                </a>
                <a href="/Web-dev/WebCreate" id="btn-mis-paginas" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
                    Subir Nuevo Template
                </a>
            </div>

            <hr class="border-slate-800">

            <!-- Filtro: Temática (Dropdown) -->
            <div class="flex flex-col gap-2">
                <label for="filtro-tematica" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Temática</label>
                <select id="filtro-tematica" class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-cyan-500 transition-all cursor-pointer">
                    <option value="todas">Todas las temáticas</option>
                    <option value="tecnologia">Tecnología</option>
                    <option value="restaurantes">Restaurantes</option>
                    <option value="moda">Moda / Ecommerce</option>
                    <option value="blogs">Blogs Personales</option>
                </select>
            </div>

            <!-- Filtro: Precio (Radio Buttons) -->
            <div class="bg-slate-900/80 p-4 rounded-xl border border-slate-800 flex flex-col gap-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Precio</span>
                
                <div class="flex flex-col gap-2">
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-white">
                        <input type="radio" name="filtro-precio" value="todos" checked class="accent-cyan-500 cursor-pointer">
                        <span>Todos los precios</span>
                    </label>

                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-white">
                        <input type="radio" name="filtro-precio" value="0" class="accent-cyan-500 cursor-pointer">
                        <span>00$ (Gratis)</span>
                    </label>
                    
                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-white">
                        <input type="radio" name="filtro-precio" value="15" class="accent-cyan-500 cursor-pointer">
                        <span>Hasta 15$</span>
                    </label>

                    <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer hover:text-white">
                        <input type="radio" name="filtro-precio" value="20+" class="accent-cyan-500 cursor-pointer">
                        <span>Más de 20$</span>
                    </label>
                </div>
            </div>

        </aside>

        <!-- Contenido Principal (Catálogo de Blogs) -->
        <main class="flex-1 p-8">

            <!-- Grid de Blogs disponibles -->
            <div id="shop" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                
                <!-- EJEMPLO DE TARJETA DE BLOG (Muestra dinámica) -->
                <article class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden shadow-xl flex flex-col hover:border-slate-700 transition-all">
                    <!-- Título -->
                    <div class="p-4 border-b border-slate-800/80 text-center">
                        <h3 class="text-lg font-bold text-cyan-400 truncate">Título del Blog</h3>
                    </div>

                    <!-- Imagen del Blog -->
                    <div class="relative h-48 bg-slate-800 overflow-hidden">
                        <img src="https://via.placeholder.com/400x220" alt="Preview del blog" class="w-full h-full object-cover">
                    </div>

                    <!-- Precio -->
                    <div class="py-3 text-center bg-slate-950/40 border-t border-b border-slate-800/60">
                        <span class="text-xl font-bold text-slate-100">Precio: <span class="text-cyan-400">15$</span></span>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="p-4 grid grid-cols-2 gap-3 bg-slate-900">
                        <button class="btn-agregar bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-2 px-3 rounded-lg text-sm transition-all text-center">
                            Agregar
                        </button>
                        <button class="btn-detalles bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-semibold py-2 px-3 rounded-lg text-sm transition-all text-center">
                            Detalles
                        </button>
                    </div>
                </article>

            </div>
        </main>

    </div>
    


<script src="../PaginaPrincipal/componentes/nav.js"></script>
<script src="index.js"></script>
</body>
</html>
