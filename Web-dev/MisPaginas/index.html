<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../PaginaPrincipal/output.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>WebCraft</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pt-16">

    <!-- Barra de navegación fija superior -->
    <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>

    <!-- Layout Principal: Sidebar + Contenido de Tienda -->
    <div class="flex min-h-[calc(100vh-4rem)]">

        <!-- Sidebar Izquierdo: Secciones y Redes -->
        <aside class="w-64 bg-slate-900/50 border-r border-slate-800 p-6 flex flex-col gap-6 shrink-0">
            
            <!-- Navegación de Secciones -->
            <div class="flex flex-col gap-2">
                <a href="/Web-dev/" id="btn-tienda" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
                    Ver Páginas
                </a>
                <a href="/Web-dev/MisPaginas" id="btn-mis-paginas" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition-all hover:bg-cyan-500/20">
                    Mis Páginas
                </a>
                <a href="/Web-dev/WebCreate" id="btn-subir-template" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
                    Subir Nuevo Template
                </a>
            </div>

            <hr class="border-slate-800">

    <!-- CONTENEDOR DINÁMICO DE ENLACES SOCIAS -->
      <div id="social-links-container" class="flex flex-col gap-2"></div>

        </aside>

        <!-- Contenido Principal (Catálogo) -->
        <main class="flex-1 p-6">
            <div id="shop-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </main>

    </div>

    <!-- Contenedor dinámico de notificaciones -->
    <div id="notificacion" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Scripts de la aplicación -->
    <script type="module" src="../../PaginaPrincipal/componentes/links.js"></script>
    <script type="module" src="../../PaginaPrincipal/componentes/nav.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
