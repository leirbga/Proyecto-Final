<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/PaginaPrincipal/output.css">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body id="bodyFondo" class="text-slate-100 min-h-screen flex items-center justify-center pt-16 bg-slate-950">
    <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>
    <form id="formularioLogin" class="w-full max-w-md bg-slate-900/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-slate-800">
        
        <h2 class="text-2xl font-bold text-center text-cyan-400 mb-6">Iniciar Sesion</h2>

        <div id="contenedorLogin" class="flex flex-col gap-4">
            
          
            <div>
                <input type="email" id="email" placeholder="Introduce tu Email" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none transition-all">
            </div>

            <div>
                <input type="password" id="contrasena" placeholder="Introduce una contraseña" class="w-full px-4 py-3 bg-slate-800/80 border border-slate-700 rounded-lg text-white placeholder-slate-400 focus:outline-none transition-all">
            </div>

            <p id="textError" class="text-red-500 font-semibold hover:underline"></p>

            <button type="submit" id="btn-login" class="mt-2 w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-cyan-500/20 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                Iniciar Sesion
            </button>

            <p class="text-sm text-center text-slate-400 mt-2">
                ¿No tienes una cuenta? 
                <a href="/front/registro" class="text-cyan-400 font-semibold hover:underline hover:text-cyan-300 transition-colors">
                    Registrarse
                </a>
            </p>
        </div>

    </form>


    <script src="index.js"></script>
    <script type="module" src="/PaginaPrincipal/componentes/nav.js"></script>
</body>
</html>
