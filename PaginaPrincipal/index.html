<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <!-- Axios CDN por si nav.js o index.js consumen endpoints directamente -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <title>WebCraft - Plantillas Web Modernas</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pt-16">

    <!-- Navbar Superior Dinámico -->
    <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>

    <!-- Hero Section -->
    <header id="bg-principal" class="relative bg-[url(/img/fondo.png)] bg-cover bg-center bg-no-repeat flex items-center justify-center w-full h-[65vh]">
        <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-slate-950/60 to-slate-950"></div>
        <div class="relative z-10 text-center px-4 max-w-3xl mx-auto">
            <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight drop-shadow-lg leading-tight">
                Compra la plantilla web que quieras
            </h1>
            <p class="mt-4 text-lg md:text-xl text-cyan-400 font-medium drop-shadow">
                Diseño rápido, flexible y moderno con WebCraft
            </p>
        </div>
    </header>

    <!-- Sección de Ejemplos / Destacados -->
    <section class="max-w-7xl mx-auto px-6 py-12 flex flex-col gap-8">
        
        <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
            <h2 class="text-2xl font-bold text-slate-100 tracking-wide">Ejemplos Destacados</h2>
            <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20">Popular</span>
        </div>

        <!-- Grid de Ejemplos -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div id="content1" class="min-h-[280px] rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition-all p-6 flex items-center justify-center font-bold text-slate-300 shadow-xl group">
                <span class="group-hover:text-cyan-400 transition-colors">Prueba 1</span>
            </div>

            <div id="content2" class="min-h-[280px] rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition-all p-6 flex items-center justify-center font-bold text-slate-300 shadow-xl group">
                <span class="group-hover:text-cyan-400 transition-colors">Prueba 2</span>
            </div>

            <div id="content3" class="min-h-[280px] rounded-2xl bg-slate-900 border border-slate-800 hover:border-slate-700 transition-all p-6 flex items-center justify-center font-bold text-slate-300 shadow-xl group">
                <span class="group-hover:text-cyan-400 transition-colors">Prueba 3</span>
            </div>

        </div>
    </section>

    <!-- Scripts ES Modules -->
    <script type="module" src="./componentes/nav.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
