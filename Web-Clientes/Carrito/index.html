<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebCraft - Carrito de Compras</title>
  <link rel="stylesheet" href="../../PaginaPrincipal/output.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pt-20">

  <!-- Navbar Superior (Volver atrás + Cerrar sesión) -->
  <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>

  <!-- Contenedor Principal (2 Columnas) -->
  <main class="max-w-6xl mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6 text-white">Carrito de Compras</h1>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Columna Izquierda: Lista de Plantillas Agregadas -->
      <section class="lg:col-span-2 space-y-4" id="cart-list">
        <!-- Las tarjetas dinámicas se inyectan aquí -->
      </section>

      <!-- Columna Derecha: Tarjeta de Resumen y Compra -->
      <aside class="lg:col-span-1">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl sticky top-24 flex flex-col justify-between min-h-[300px]">
          <div>
            <h2 class="text-xl font-bold text-white border-b border-slate-800 pb-3 mb-4">Resumen</h2>
            
            <!-- Desglose de productos agregados -->
            <div id="summary-items" class="space-y-2 mb-4 max-h-48 overflow-y-auto pr-1 border-b border-slate-800/60 pb-4">
              <!-- Se renderiza cada título y su precio -->
            </div>

            <!-- Total Acumulado -->
            <div class="flex items-center justify-between text-lg font-bold pt-2">
              <span class="text-slate-300">Total</span>
              <span id="cart-total" class="text-cyan-400 text-2xl font-black">$0</span>
            </div>
          </div>

          <!-- Botón de Compra -->
          <button id="btn-comprar" class="w-full mt-6 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-base rounded-xl transition-all shadow-lg shadow-cyan-500/10 cursor-pointer">
            Comprar
          </button>
        </div>
      </aside>

    </div>
  </main>

  <script type="module" src="../../PaginaPrincipal/componentes/notificaciones.js"></script>
  <script type="module" src="../../PaginaPrincipal/componentes/nav.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
