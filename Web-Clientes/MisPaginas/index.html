<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../PaginaPrincipal/output.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <title>Mis Páginas - WebCraft</title>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pt-16">

  <!-- Barra de navegación principal -->
  <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>

  <!-- Layout Principal -->
  <div class="flex min-h-[calc(100vh-4rem)]">

    <!-- Sidebar Izquierdo: Navegación y Filtros -->
    <aside class="w-64 bg-slate-900/50 border-r border-slate-800 p-6 flex flex-col gap-6 shrink-0 hidden md:flex">
      
      <!-- Navegación de Secciones -->
      <nav class="flex flex-col gap-2">
        <a href="/Web-Clientes" id="btn-tienda" 
           class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
          Tienda
        </a>
        <a href="/Web-Clientes/MisPaginas" id="btn-mis-paginas" 
           class="w-full text-left px-4 py-2.5 rounded-lg font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition-all hover:bg-cyan-500/20">
          Mis Páginas
        </a>
      </nav>

      <hr class="border-slate-800">

      <!-- Filtro: Temática -->
      <div class="flex flex-col gap-1.5">
        <label for="filtro-tematica" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Temática</label>
        <select id="filtro-tematica" class="w-full bg-slate-950/40 border border-slate-800/80 hover:border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 cursor-pointer transition-all">
          <option value="todas">Todas las temáticas</option>
        </select>
      </div>

      <!-- Filtro: Precio -->
      <div class="flex flex-col gap-1.5">
        <label for="filtro-precio" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Rango de Precio</label>
        <select id="filtro-precio" class="w-full bg-slate-950/40 border border-slate-800/80 hover:border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 cursor-pointer transition-all">
          <option value="todos">Todos los precios</option>
        </select>
      </div>
    </aside>

    <!-- Contenido Principal: Grid de Mis Páginas Compradas -->
    <main class="flex-1 p-6 lg:p-8">
      <section id="mis-paginas-section" class="max-w-7xl mx-auto">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-800">
          <div>
            <h1 class="text-2xl font-bold text-white">Mis Páginas Compradas</h1>
            <p class="text-slate-400 text-sm">Gestiona y accede a las plantillas que has adquirido.</p>
          </div>
        </div>

        <!-- Contenedor donde renderizarMisPaginas() insertará las tarjetas -->
        <div id="mis-paginas-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      </section>
    </main>

  </div>

  <!-- Scripts ESM -->
  <script type="module" src="./index.js"></script>
  <script type="module" src="../../PaginaPrincipal/componentes/nav.js"></script>
</body>
</html>
