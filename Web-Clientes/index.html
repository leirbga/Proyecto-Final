<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCraft - Tienda</title>
    <link rel="stylesheet" href="../PaginaPrincipal/output.css" />
    <!-- Carga de Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen pt-16" id="bodyFondo">
    <!-- Navbar Superior (Se renderiza con nav.js) -->
    <nav id="navBar" class="fixed top-0 right-0 left-0 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 z-50 h-16"></nav>

    <!-- Layout Principal: Sidebar + Contenido de Tienda -->
    <div class="flex min-h-[calc(100vh-4rem)]">
      <!-- Sidebar Izquierdo: Filtros y Secciones -->
      <aside class="w-64 bg-slate-900/50 border-r border-slate-800 p-6 flex flex-col gap-6 shrink-0">
        <!-- Navegación de Secciones -->
        <div class="flex flex-col gap-2">
          <a href="/Web-Clientes" id="btn-tienda" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 transition-all hover:bg-cyan-500/20">
            Tienda
          </a>
          <a href="/Web-Clientes/MisPaginas" id="btn-mis-paginas" class="w-full text-left px-4 py-2.5 rounded-lg font-semibold text-slate-400 hover:text-white hover:bg-slate-800/60 transition-all">
            Mis Páginas
          </a>
        </div>

        <hr class="border-slate-800" />

        <!-- Filtro: Temática (Dropdown) -->
        <div class="flex flex-col gap-1.5">
          <label for="filtro-tematica" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Temática</label>
          <select id="filtro-tematica" class="w-full bg-slate-950/40 border border-slate-800/80 hover:border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 cursor-pointer transition-all">
          </select>
        </div>

        <!-- Filtro: Precio (Dropdown) -->
        <div class="flex flex-col gap-1.5">
          <label for="filtro-precio" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Rango de Precio</label>
          <select id="filtro-precio" class="w-full bg-slate-950/40 border border-slate-800/80 hover:border-slate-700 text-slate-200 text-xs rounded-lg p-2.5 outline-none focus:border-cyan-500/50 focus:ring-1 focus:ring-cyan-500/50 cursor-pointer transition-all">
          </select>
        </div>
      </aside>

      <!-- Contenido Principal (Catálogo) -->
      <main class="flex-1 p-8">
        <!-- Grid donde se inyectan las publicaciones desde JavaScript -->
        <div id="shop-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </main>
    </div>

    <!-- Contenedor dinámico de notificaciones -->
    <div id="notificacion" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

    <!-- Scripts ES Modules -->
    <script type="module" src="../PaginaPrincipal/componentes/filtros.js"></script>
    <script type="module" src="../PaginaPrincipal/componentes/nav.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
